name: nano

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ghcr.io/shaoqi2002/nano-backend:${NANO_IMAGE_TAG:-latest}
    restart: unless-stopped
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD}@postgres:5432/agent
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-v4-flash-vision-exp}
      CHAT_CONTEXT_MESSAGE_LIMIT: ${CHAT_CONTEXT_MESSAGE_LIMIT:-50}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-4}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-6}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-15}
      WEB_EXTRACT_MAX_URLS: ${WEB_EXTRACT_MAX_URLS:-5}
      WEB_EXTRACT_MAX_CONTENT_LENGTH: ${WEB_EXTRACT_MAX_CONTENT_LENGTH:-20000}
      WEB_EXTRACT_TIMEOUT_SECONDS: ${WEB_EXTRACT_TIMEOUT_SECONDS:-45}
      DEEP_RESEARCH_TIMEOUT_SECONDS: ${DEEP_RESEARCH_TIMEOUT_SECONDS:-180}
      DEEP_RESEARCH_POLL_INTERVAL_SECONDS: ${DEEP_RESEARCH_POLL_INTERVAL_SECONDS:-2}
      DEEP_RESEARCH_MAX_CONTENT_LENGTH: ${DEEP_RESEARCH_MAX_CONTENT_LENGTH:-30000}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-26214400}
      DOCUMENT_CACHE_DIR: /data/document-cache
      DOCUMENT_CACHE_MAX_BYTES: ${DOCUMENT_CACHE_MAX_BYTES:-5368709120}
      AGENT_WORKSPACE_DIR: /data/agent-workspace
      CHAT_ARTIFACT_DIR: /data/chat-artifacts
      CHAT_ARTIFACT_TTL_SECONDS: ${CHAT_ARTIFACT_TTL_SECONDS:-86400}
      LOCAL_READ_MAX_CHARS: ${LOCAL_READ_MAX_CHARS:-50000}
      LOCAL_SEARCH_MAX_RESULTS: ${LOCAL_SEARCH_MAX_RESULTS:-100}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}
      DOCUMENT_INDEX_POLL_SECONDS: ${DOCUMENT_INDEX_POLL_SECONDS:-5}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.25}
      RAG_QUERY_MIN_SIMILARITY: ${RAG_QUERY_MIN_SIMILARITY:-0.45}
      RAG_MAX_SCORE_DROP: ${RAG_MAX_SCORE_DROP:-0.12}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-700}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-100}
    volumes:
      - ${DOCUMENT_CACHE_PATH:-./document_cache}:/data/document-cache
      - ${AGENT_WORKSPACE_PATH:-./agent_workspace}:/data/agent-workspace
      - ${CHAT_ARTIFACT_PATH:-./chat_artifacts}:/data/chat-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/shaoqi2002/nano-frontend:${NANO_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
