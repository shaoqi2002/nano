name: nano

services:
  postgres:
    image: postgres:17-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ghcr.io/shaoqi2002/nano-backend:latest
    pull_policy: always
    restart: unless-stopped
    dns:
      - 223.5.5.5
      - 119.29.29.29
    extra_hosts:
      # R4S Docker DNS may be unable to query external resolvers when
      # Tailscale owns the host resolv.conf. Keep all currently advertised
      # DeepSeek edge addresses as a persistent fallback.
      - "api.deepseek.com=112.13.210.86"
      - "api.deepseek.com=39.174.179.5"
      - "api.deepseek.com=39.173.157.74"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD}@postgres:5432/agent
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      CHAT_CONTEXT_MESSAGE_LIMIT: ${CHAT_CONTEXT_MESSAGE_LIMIT:-50}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/shaoqi2002/nano-frontend:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

  watchtower:
    image: nickfedor/watchtower:arm64v8-1.20.2
    pull_policy: always
    restart: unless-stopped
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
